# Release pipeline (0.6.0).
#
# Pushing a version tag (v*) builds, signs, verifies and publishes a
# full GitHub release: Muse-Portable.exe, Muse-Setup-<version>.exe,
# SHA256SUMS.txt and the public signing cert. A manual dispatch run
# does everything except publish, and leaves the same files as run
# artifacts for inspection.
#
# Signing uses two repository secrets:
#   MUSE_SIGN_PFX_BASE64  base64 of the code-signing .pfx
#   MUSE_SIGN_PASSWORD    the .pfx password
# scripts/sign-exe.js reads them through its MUSE_SIGN_PFX /
# MUSE_SIGN_PASSWORD environment contract and drives signtool on
# Windows. The fingerprint gate before publishing applies the exact
# test the in-app updater applies to a download: signer fingerprint
# equals the constant pinned in src/updater.js, timestamp present.
name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MUSE_SIGN_PASSWORD: ${{ secrets.MUSE_SIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Guard - tag matches package.json version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $want = "v$($pkg.version)"
          if ($env:GITHUB_REF_NAME -ne $want) {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version ($want)"
          }
          Write-Host "Tag matches package.json: $want"

      - name: Materialize signing certificate
        shell: pwsh
        env:
          MUSE_SIGN_PFX_BASE64: ${{ secrets.MUSE_SIGN_PFX_BASE64 }}
        run: |
          if (-not $env:MUSE_SIGN_PFX_BASE64) { throw "MUSE_SIGN_PFX_BASE64 secret is not set" }
          if (-not $env:MUSE_SIGN_PASSWORD) { throw "MUSE_SIGN_PASSWORD secret is not set" }
          $pfx = Join-Path $env:RUNNER_TEMP "muse-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MUSE_SIGN_PFX_BASE64))
          "MUSE_SIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $pw = ConvertTo-SecureString $env:MUSE_SIGN_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          $cer = Join-Path $PWD "muse-signing-cert.cer"
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\CurrentUser\TrustedPublisher | Out-Null
          Write-Host "Signing cert ready: $($cert.Subject)"

      - name: Build portable (pack, stamp, sign, portable, verify, sign)
        run: npm run release

      - name: Build Setup installer
        run: npm run dist:setup

      - name: Sign Setup installer
        run: npm run sign:setup

      - name: Verify signer fingerprints (the updater's own test)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Muse-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "No Muse-Setup-*.exe in dist/" }
          & scripts\verify-signature.ps1 -File dist\win-unpacked\Muse.exe
          & scripts\verify-signature.ps1 -File dist\Muse-Portable.exe
          & scripts\verify-signature.ps1 -File $setup.FullName

      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Muse-Setup-*.exe | Select-Object -First 1
          $lines = @()
          foreach ($f in @("dist\Muse-Portable.exe", $setup.FullName)) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $lines += "$h  $(Split-Path $f -Leaf)"
          }
          $lines | Out-File -FilePath dist\SHA256SUMS.txt -Encoding ascii
          $lines

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muse-desktop-${{ github.ref_name }}
          path: |
            dist/Muse-Portable.exe
            dist/Muse-Setup-*.exe
            dist/SHA256SUMS.txt
            muse-signing-cert.cer
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Muse Desktop ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/Muse-Portable.exe
            dist/Muse-Setup-*.exe
            dist/SHA256SUMS.txt
            muse-signing-cert.cer
          fail_on_unmatched_files: true
