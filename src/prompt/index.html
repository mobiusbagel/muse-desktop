<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="../../assets/tray-32.png">
<title>Muse — Permission Request</title>
<style>
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    margin: 0;
    padding: 20px 22px;
    color: #1c1c28;
    background: #f7f6fb;
  }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { font-size: 12.5px; color: #5a5872; margin-bottom: 14px; }
  .cap {
    font-size: 14px; font-weight: 600;
    background: #ece9f7; border: 1px solid #d4cdf0; border-radius: 8px;
    padding: 8px 12px; margin-bottom: 10px;
  }
  .detail {
    font-family: Consolas, "Cascadia Mono", monospace;
    font-size: 12.5px; word-break: break-all;
    background: #fff; border: 1px solid #ddd9ec; border-radius: 8px;
    padding: 10px 12px; margin-bottom: 16px;
  }
  .detail.command {
    white-space: pre-wrap; word-break: normal; overflow-wrap: anywhere;
    overflow-y: auto; max-height: 172px;
  }
  label.always {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; margin-bottom: 18px; cursor: pointer;
  }
  .buttons { display: flex; gap: 10px; justify-content: flex-end; }
  button {
    font-size: 13.5px; padding: 8px 18px; border-radius: 8px; cursor: pointer;
    border: 1px solid #b9b3d9; background: #fff; color: #1c1c28;
  }
  button.allow { background: #6d28d9; border-color: #6d28d9; color: #fff; font-weight: 600; }
  button:hover { filter: brightness(0.97); }
</style>
</head>
<body>
  <h1>Muse is asking for permission</h1>
  <div class="sub">Something on this PC was requested through the Muse local bridge.</div>
  <div class="cap" id="capability">…</div>
  <div class="detail" id="detail">…</div>
  <label class="always">
    <input type="checkbox" id="remember">
    <span id="rememberLabel">Remember my choice — always allow this capability (updates permissions.json)</span>
  </label>
  <div class="buttons">
    <button id="deny" type="button">Deny</button>
    <button id="allow" class="allow" type="button">Allow once</button>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
